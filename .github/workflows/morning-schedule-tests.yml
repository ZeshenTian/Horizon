name: Morning schedule safety tests

on:
  pull_request:
    paths:
      - '.github/workflows/daily-summary.yml'
      - '.github/workflows/morning-schedule-tests.yml'
      - 'src/morning*.py'
      - 'src/_file_utils.py'
      - 'tests/test_morning*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-summary.yml'
      - '.github/workflows/morning-schedule-tests.yml'
      - 'src/morning*.py'
      - 'src/_file_utils.py'
      - 'tests/test_morning*.py'

permissions:
  contents: read
  actions: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test time boundaries and duplicate-delivery guard (no credentials or email)
        run: python -m unittest tests.test_morning tests.test_morning_schedule -v

  live-api-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual GitHub metadata before a harmless future step
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from src.morning_schedule import DELIVERY_STEP, delivery_attempted, delivery_blocker, github_get

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          prefix = f"/repos/{repository}/actions/runs"
          current = github_get(f"{prefix}/{run_id}")
          payload = github_get(f"{prefix}/{run_id}/jobs?filter=all&per_page=100")
          jobs = [job for job in payload["jobs"] if job["name"] == "live-api-canary"]
          steps = [step for job in jobs for step in job["steps"] if step["name"] == "Safe no-send canary"]
          if not steps:
              raise RuntimeError("Live canary step metadata is not visible yet")
          step = {key: steps[-1].get(key) for key in ("name", "status", "conclusion", "started_at", "completed_at")}
          print("Live future-step metadata: " + json.dumps(step), flush=True)

          def observed_get(path):
              result = github_get(path)
              key = "jobs" if "jobs" in result else "workflow_runs"
              print(json.dumps({"collection": key, "total_count": result.get("total_count"), "returned_count": len(result.get(key, []))}), flush=True)
              return result

          # This workflow has no real delivery step and no model/email secrets.
          assert delivery_blocker(observed_get, repository, current) is None
          step["name"] = DELIVERY_STEP
          assert not delivery_attempted({"steps": [step]})
          PY
      - name: Safe no-send canary
        run: echo 'Metadata test only. No digest, model call or email is performed.'
