name: Morning Sweet Treat

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai on the same calendar date.
    - cron: '0 0 * * *'
    # Off-the-hour backup triggers can overtake a delayed/dropped primary event.
    # The 08:00 Beijing cutoff is unchanged; these are not extra daily emails.
    - cron: '7,27,47 0 * * *'
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Prevent scheduled and manually triggered runs from sending concurrently.
concurrency:
  group: horizon-morning-mail
  cancel-in-progress: false

jobs:
  morning:
    # Manual runs on feature branches must not send or create branch-local receipts.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: '1'
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS || secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
      LWN_KEY: ${{ secrets.LWN_KEY }}

    steps:
      - uses: actions/checkout@v6
      - name: Resolve Beijing issue date and report trigger delay
        id: window
        run: python3 -m src.morning_schedule resolve

      - name: Restore successful delivery receipt
        id: receipt
        uses: actions/cache/restore@v4
        with:
          path: data/morning/${{ steps.window.outputs.issue_date }}.sent.json
          key: horizon-morning-sent-v1-${{ steps.window.outputs.issue_date }}

      - name: Check previous delivery attempts
        id: guard
        if: steps.receipt.outputs.cache-hit != 'true'
        run: python3 -m src.morning_schedule check

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.send == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.send == 'true'
        with:
          version: '0.11.26'
      - name: Install dependencies
        if: steps.guard.outputs.send == 'true'
        run: uv sync --frozen

      - name: Prepare private runtime configuration
        if: steps.guard.outputs.send == 'true'
        run: |
          cp data/config.github.json data/config.json
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          from src.morning import valid_email
          address = os.environ.get("GMAIL_ADDRESS", "").strip()
          if not valid_email(address):
              raise SystemExit("Set the repository variable GMAIL_ADDRESS to your Gmail address.")
          Path("data/subscribers.json").write_text(json.dumps([address]), encoding="utf-8")
          PY
          uv run horizon --check-morning-config

      - name: Generate and send morning email
        id: delivery
        if: steps.guard.outputs.send == 'true'
        env:
          ISSUE_DATE: ${{ steps.window.outputs.issue_date }}
        run: uv run horizon --morning --morning-date "$ISSUE_DATE"

      - name: Save successful delivery receipt
        if: success() && steps.delivery.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/morning/${{ steps.window.outputs.issue_date }}.sent.json
          key: horizon-morning-sent-v1-${{ steps.window.outputs.issue_date }}

      - name: Save digest for review
        if: always() && steps.delivery.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: morning-${{ steps.window.outputs.issue_date }}
          path: data/summaries/*-zh.md
          retention-days: 14

